server:
  port: 8084

spring:
  application:
    name: booking-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/haloticket-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
  datasource:
    url: jdbc:postgresql://localhost:5433/booking_db
    username: ${POSTGRES_USER:haloticket}
    password: ${POSTGRES_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

booking:
  ga:
    reservation:
      internal-token: ${TICKET_RESERVATION_INTERNAL_TOKEN:}
      slack-seconds: ${BOOKING_GA_RESERVATION_SLACK_SECONDS:60}
  # a payment that arrives after its booking was cancelled or expired (general-admission-only orders can take the stock back)
  late-payment:
    reopen-minutes: ${BOOKING_LATE_PAYMENT_REOPEN_MINUTES:10}
  # admin reconciliation of paid orders that have too few tickets
  reconcile:
    paid-grace-minutes: ${BOOKING_RECONCILE_PAID_GRACE_MINUTES:10}
    batch-size: ${BOOKING_RECONCILE_BATCH_SIZE:200}
    max-batches: ${BOOKING_RECONCILE_MAX_BATCHES:5}
    lookback-days: ${BOOKING_RECONCILE_LOOKBACK_DAYS:14}
    stock-limit: ${BOOKING_RECONCILE_STOCK_LIMIT:200}

# order limits (OrderLimitValidator): a failed or slow read only skips the check, so keep the wait short
spring.cloud.openfeign.client.config.ticketOrderLimitClient:
  connect-timeout: 1000
  read-timeout: 2000

spring.cloud.openfeign.client.config.ticketStockClient:
  connect-timeout: 2000
  read-timeout: 5000
