server:
  port: 8081

spring:
  application:
    name: user-service
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/haloticket-realm}
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: ${POSTGRES_USER:haloticket}
    password: ${POSTGRES_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

auth:
  otp:
    delivery: ${AUTH_OTP_DELIVERY:disabled}
    mail:
      from: ${SMTP_FROM:}
      expiry-minutes: ${AUTH_OTP_EXPIRY_MINUTES:5}
