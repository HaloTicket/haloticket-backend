server:
  port: 8081

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: user-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/haloticket-realm}
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: ${POSTGRES_USER:haloticket}
    password: ${POSTGRES_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

auth:
  otp:
    pepper: ${AUTH_OTP_PEPPER:haloticket-default-secret-pepper-2026}
    delivery: kafka
    kafka:
      topic: ${AUTH_OTP_KAFKA_TOPIC:haloticket.auth.otp.v1}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:9080}
  realm: ${KEYCLOAK_REALM:haloticket-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:user-service}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:user-service-secret}

ekyc:
  fingerprint-secret: ${EKYC_FINGERPRINT_SECRET:}
  minimum-face-match-score: ${EKYC_MINIMUM_FACE_MATCH_SCORE:0.9}
  vnpt:
    enabled: ${VNPT_EKYC_ENABLED:false}
    base-url: ${VNPT_EKYC_BASE_URL:https://api.idg.vnpt.vn}
    token-id: ${VNPT_EKYC_TOKEN_ID:}
    token-key: ${VNPT_EKYC_TOKEN_KEY:}
    access-token: ${VNPT_EKYC_ACCESS_TOKEN:}
