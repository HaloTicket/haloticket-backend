name: Backend Microservices Selective CI/CD

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  # STEP 1: Detect Changed Microservices
  detect-changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      discovery-server: ${{ steps.filter.outputs.discovery-server }}
      user-service: ${{ steps.filter.outputs.user-service }}
      event-service: ${{ steps.filter.outputs.event-service }}
      ticket-service: ${{ steps.filter.outputs.ticket-service }}
      booking-service: ${{ steps.filter.outputs.booking-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      media-service: ${{ steps.filter.outputs.media-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      marketplace-service: ${{ steps.filter.outputs.marketplace-service }}
      ai-assistant-service: ${{ steps.filter.outputs.ai-assistant-service }}
      shared-files: ${{ steps.filter.outputs.shared-files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared-files:
              - 'docker-compose.yml'
              - 'Dockerfile'
              - 'scripts/**'
              - '.env.example'
              - 'DEPLOYMENT.md'
              - 'README.md'
            api-gateway:
              - 'api-gateway/**'
            discovery-server:
              - 'discovery-server/**'
            user-service:
              - 'user-service/**'
            event-service:
              - 'event-service/**'
            ticket-service:
              - 'ticket-service/**'
            booking-service:
              - 'booking-service/**'
            payment-service:
              - 'payment-service/**'
            media-service:
              - 'media-service/**'
            notification-service:
              - 'notification-service/**'
            marketplace-service:
              - 'marketplace-service/**'
            ai-assistant-service:
              - 'ai-assistant-service/**'

  # STEP 2: Build and push the images of the changed microservices
  # 2.1. Api Gateway: build and push the image
  build-api-gateway:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api-gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=api-gateway
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-api-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.2. Event Service: build and push the image
  build-event-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.event-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=event-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-event-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-event-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.3. Ticket Service: build and push the image
  build-ticket-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ticket-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=ticket-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-ticket-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-ticket-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.4. Booking Service: build and push the image
  build-booking-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.booking-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=booking-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-booking-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-booking-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.5. Payment Service: build and push the image
  build-payment-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.payment-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=payment-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-payment-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-payment-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.6. User Service: build and push the image
  build-user-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.user-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=user-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-user-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-user-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.7. Media Service: build and push the image
  build-media-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.media-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=media-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-media-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-media-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.8. Notification Service: build and push the image
  build-notification-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.notification-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=notification-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-notification-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-notification-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.9. Discovery Server (Eureka): build and push the image
  build-discovery-server:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.discovery-server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=discovery-server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-discovery-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-discovery-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.10. Marketplace Service: build and push the image 
  build-marketplace-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.marketplace-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=marketplace-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-marketplace-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-marketplace-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2.11. AI Assistant Service (Python): build and push the image
  build-ai-assistant-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ai-assistant-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-assistant-service
          file: ./ai-assistant-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-ai-assistant-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-ai-assistant-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # STEP 3: Deploy to the VPS, ONE job, one service after the other.
  deploy-vps:
    name: Deploy changed services to the VPS
    needs: [detect-changes, build-discovery-server, build-user-service, build-event-service, build-ticket-service, build-booking-service, build-payment-service, build-marketplace-service, build-notification-service, build-media-service, build-ai-assistant-service, build-api-gateway]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && (
      (needs.detect-changes.outputs.discovery-server == 'true' && needs.build-discovery-server.result == 'success') ||
      (needs.detect-changes.outputs.user-service == 'true' && needs.build-user-service.result == 'success') ||
      (needs.detect-changes.outputs.event-service == 'true' && needs.build-event-service.result == 'success') ||
      (needs.detect-changes.outputs.ticket-service == 'true' && needs.build-ticket-service.result == 'success') ||
      (needs.detect-changes.outputs.booking-service == 'true' && needs.build-booking-service.result == 'success') ||
      (needs.detect-changes.outputs.payment-service == 'true' && needs.build-payment-service.result == 'success') ||
      (needs.detect-changes.outputs.marketplace-service == 'true' && needs.build-marketplace-service.result == 'success') ||
      (needs.detect-changes.outputs.notification-service == 'true' && needs.build-notification-service.result == 'success') ||
      (needs.detect-changes.outputs.media-service == 'true' && needs.build-media-service.result == 'success') ||
      (needs.detect-changes.outputs.ai-assistant-service == 'true' && needs.build-ai-assistant-service.result == 'success') ||
      (needs.detect-changes.outputs.api-gateway == 'true' && needs.build-api-gateway.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (one at a time, verified)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          timeout: 60s
          command_timeout: 45m
          script: |
            set -Eeuo pipefail

            # What this run deploys: changed AND built. BUILD_FAILED: changed, but the image build did not succeed.
            SERVICES="${{ needs.detect-changes.outputs.discovery-server == 'true' && needs.build-discovery-server.result == 'success' && 'discovery-server ' || '' }}${{ needs.detect-changes.outputs.user-service == 'true' && needs.build-user-service.result == 'success' && 'user-service ' || '' }}${{ needs.detect-changes.outputs.event-service == 'true' && needs.build-event-service.result == 'success' && 'event-service ' || '' }}${{ needs.detect-changes.outputs.ticket-service == 'true' && needs.build-ticket-service.result == 'success' && 'ticket-service ' || '' }}${{ needs.detect-changes.outputs.booking-service == 'true' && needs.build-booking-service.result == 'success' && 'booking-service ' || '' }}${{ needs.detect-changes.outputs.payment-service == 'true' && needs.build-payment-service.result == 'success' && 'payment-service ' || '' }}${{ needs.detect-changes.outputs.marketplace-service == 'true' && needs.build-marketplace-service.result == 'success' && 'marketplace-service ' || '' }}${{ needs.detect-changes.outputs.notification-service == 'true' && needs.build-notification-service.result == 'success' && 'notification-service ' || '' }}${{ needs.detect-changes.outputs.media-service == 'true' && needs.build-media-service.result == 'success' && 'media-service ' || '' }}${{ needs.detect-changes.outputs.ai-assistant-service == 'true' && needs.build-ai-assistant-service.result == 'success' && 'ai-assistant-service ' || '' }}${{ needs.detect-changes.outputs.api-gateway == 'true' && needs.build-api-gateway.result == 'success' && 'api-gateway ' || '' }}"
            BUILD_FAILED="${{ needs.detect-changes.outputs.discovery-server == 'true' && needs.build-discovery-server.result != 'success' && 'discovery-server ' || '' }}${{ needs.detect-changes.outputs.user-service == 'true' && needs.build-user-service.result != 'success' && 'user-service ' || '' }}${{ needs.detect-changes.outputs.event-service == 'true' && needs.build-event-service.result != 'success' && 'event-service ' || '' }}${{ needs.detect-changes.outputs.ticket-service == 'true' && needs.build-ticket-service.result != 'success' && 'ticket-service ' || '' }}${{ needs.detect-changes.outputs.booking-service == 'true' && needs.build-booking-service.result != 'success' && 'booking-service ' || '' }}${{ needs.detect-changes.outputs.payment-service == 'true' && needs.build-payment-service.result != 'success' && 'payment-service ' || '' }}${{ needs.detect-changes.outputs.marketplace-service == 'true' && needs.build-marketplace-service.result != 'success' && 'marketplace-service ' || '' }}${{ needs.detect-changes.outputs.notification-service == 'true' && needs.build-notification-service.result != 'success' && 'notification-service ' || '' }}${{ needs.detect-changes.outputs.media-service == 'true' && needs.build-media-service.result != 'success' && 'media-service ' || '' }}${{ needs.detect-changes.outputs.ai-assistant-service == 'true' && needs.build-ai-assistant-service.result != 'success' && 'ai-assistant-service ' || '' }}${{ needs.detect-changes.outputs.api-gateway == 'true' && needs.build-api-gateway.result != 'success' && 'api-gateway ' || '' }}"
            if [ -n "${BUILD_FAILED//[[:space:]]/}" ]; then
              echo "NOT deployed, their image build did not succeed: $BUILD_FAILED"
            fi
            if [ -z "${SERVICES//[[:space:]]/}" ]; then
              echo "nothing to deploy"
              exit 0
            fi

            # One deploy at a time on this machine, also across workflow runs started by pushes close together.
            exec 9>/tmp/haloticket-deploy.lock
            echo "waiting for the deploy lock..."
            flock -w 1800 9 || { echo "deploy lock not acquired within 30 minutes"; exit 1; }

            cd /home/ubuntu/haloticket-backend
            git pull origin ${{ github.ref_name }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            short_id() { local id="${1#sha256:}"; echo "${id:0:12}"; }

            # docker compose pull, at most 3 attempts, 10 seconds apart
            pull_with_retry() {
              local svc="$1" attempt
              for attempt in 1 2 3; do
                if docker compose pull "$svc"; then return 0; fi
                echo "docker compose pull $svc failed (attempt $attempt/3)"
                if [ "$attempt" -lt 3 ]; then sleep 10; fi
              done
              return 1
            }

            # the image reference the compose file uses for this service
            image_ref() {
              local ref
              ref="$(docker compose config --images 2>/dev/null | grep -E "/haloticket-$1:[^/]+$" | head -n 1 || true)"
              echo "${ref:-${DOCKERHUB_USERNAME}/haloticket-$1:${IMAGE_TAG:-latest}}"
            }

            deploy_one() {
              local svc="$1" ref want cid have waited=0 status
              echo "=== $svc ==="
              if ! pull_with_retry "$svc"; then
                echo "$svc: pull failed 3 times; the container is NOT recreated"
                return 1
              fi
              docker compose up -d --no-deps "$svc" || { echo "$svc: docker compose up failed"; return 1; }

              # the container must run the image that was just pulled
              ref="$(image_ref "$svc")"
              want="$(docker image inspect -f '{{.Id}}' "$ref")" || { echo "$svc: image $ref not found locally"; return 1; }
              cid="$(docker compose ps -q "$svc")"
              if [ -z "$cid" ]; then echo "$svc: no container after up"; return 1; fi
              have="$(docker inspect -f '{{.Image}}' "$cid")"
              if [ "$have" != "$want" ]; then
                echo "$svc: the container runs image $(short_id "$have") but $ref is $(short_id "$want")"
                return 1
              fi

              # wait for the container to be healthy, at most 3 minutes
              while [ "$waited" -lt 180 ]; do
                if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
                  echo "$svc: the container stopped (exit code $(docker inspect -f '{{.State.ExitCode}}' "$cid"))"
                  return 1
                fi
                status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}nohealthcheck{{end}}' "$cid")"
                if [ "$status" = "healthy" ]; then echo "$svc: healthy, image $(short_id "$have")"; return 0; fi
                if [ "$status" = "nohealthcheck" ] && [ "$waited" -ge 20 ]; then
                  echo "$svc: no healthcheck defined, running for 20 s, image $(short_id "$have")"
                  return 0
                fi
                sleep 5
                waited=$((waited + 5))
              done
              echo "$svc: not healthy within 3 minutes (status: $status)"
              return 1
            }

            DONE=""
            FAILED=""
            for svc in $SERVICES; do
              if deploy_one "$svc"; then DONE="$DONE $svc"; else FAILED="$FAILED $svc"; fi
            done
            echo "deployed:${DONE:- none}"
            if [ -n "$FAILED" ]; then
              echo "FAILED:$FAILED"
              exit 1
            fi
            # once, after everything succeeded (a failed deploy keeps the old images for a manual rollback)
            docker image prune -f || true

  # STEP 4: Sync Shared Files to VPS
  sync-shared-files:
    name: Sync Shared Files to VPS
    needs: [detect-changes, deploy-vps]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.shared-files == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Shared Files via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          timeout: 60s
          command_timeout: 45m
          script: |
            set -Eeuo pipefail
            exec 9>/tmp/haloticket-deploy.lock
            flock -w 1800 9 || { echo "deploy lock not acquired within 30 minutes"; exit 1; }
            cd /home/ubuntu/haloticket-backend
            git pull origin ${{ github.ref_name }}
            # Restart alert watchdog service if already running
            if systemctl is-active --quiet haloticket-alert; then
              sudo systemctl restart haloticket-alert
            fi
