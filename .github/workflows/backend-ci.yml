name: Backend Microservices Selective CI/CD

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  # STEP 1: Detect Changed Microservices
  detect-changes:
    name: Detect Changed Microservices
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      discovery-server: ${{ steps.filter.outputs.discovery-server }}
      user-service: ${{ steps.filter.outputs.user-service }}
      event-service: ${{ steps.filter.outputs.event-service }}
      ticket-service: ${{ steps.filter.outputs.ticket-service }}
      booking-service: ${{ steps.filter.outputs.booking-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      media-service: ${{ steps.filter.outputs.media-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      marketplace-service: ${{ steps.filter.outputs.marketplace-service }}
      ai-assistant-service: ${{ steps.filter.outputs.ai-assistant-service }}
      shared-files: ${{ steps.filter.outputs.shared-files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared-files:
              - 'docker-compose.yml'
              - 'Dockerfile'
              - 'scripts/**'
              - '.env.example'
              - 'DEPLOYMENT.md'
              - 'README.md'
            api-gateway:
              - 'api-gateway/**'
            discovery-server:
              - 'discovery-server/**'
            user-service:
              - 'user-service/**'
            event-service:
              - 'event-service/**'
            ticket-service:
              - 'ticket-service/**'
            booking-service:
              - 'booking-service/**'
            payment-service:
              - 'payment-service/**'
            media-service:
              - 'media-service/**'
            notification-service:
              - 'notification-service/**'
            marketplace-service:
              - 'marketplace-service/**'
            ai-assistant-service:
              - 'ai-assistant-service/**'

  # STEP 2: Build & Deploy Changed Microservices
  # 2.1. API Gateway
  deploy-api-gateway:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api-gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE=api-gateway
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-api-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haloticket-api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/haloticket-backend
            git pull origin ${{ github.ref_name }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            docker compose pull api-gateway
            docker compose up -d --no-deps api-gateway
            docker image prune -f || true

  # 2.2. Event Service
