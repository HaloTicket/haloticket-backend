x-logging: &logging
  driver: local
  options:
    max-size: "3m"
    max-file: "2"

x-runtime: &runtime
  env_file:
    - .env
  restart: unless-stopped
  networks: [haloticket-network]
  mem_limit: ${SERVICE_MEMORY_LIMIT:-300m}
  cpus: ${SERVICE_CPU_LIMIT:-1.0}
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *logging
  healthcheck:
    test: ["CMD-SHELL", "nc -z 127.0.0.1 $$SERVER_PORT"]
    interval: 15s
    timeout: 5s
    retries: 12
    start_period: 60s

x-environment: &environment
  JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTIONS:--XX:+UseSerialGC -Xss256k -XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=60 -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
  POSTGRES_USER: ${POSTGRES_USER:-haloticket}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_POOL_SIZE:-3}
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-secretpassword}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-dependencies: &dependencies
  discovery-server:
    condition: service_healthy
  postgres:
    condition: service_healthy

services:
  # Infrastructure Services

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    container_name: haloticket-postgres
    restart: unless-stopped
    logging: *logging
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c maintenance_work_mem=16MB -c max_connections=200
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      POSTGRES_USER: ${POSTGRES_USER:-haloticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./haloticket-infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haloticket}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - haloticket-network

  # Redis Cache & Fast Locking
  redis:
    image: redis:7-alpine
    mem_limit: ${REDIS_MEMORY_LIMIT:-96m}
    container_name: haloticket-redis
    restart: unless-stopped
    logging: *logging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secretpassword} --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secretpassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - haloticket-network

  # Apache Kafka (KRaft Mode - Tối ưu heap 192MB)
  kafka:
    image: apache/kafka:3.7.0
    mem_limit: ${KAFKA_MEMORY_LIMIT:-512m}
    container_name: haloticket-kafka
    restart: unless-stopped
    logging: *logging
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-24}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-haloticket-cluster-123}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9092 || /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - haloticket-network

  # Keycloak IAM (Quarkus with Auto-Import Realm - Tối ưu SerialGC & Heap 256MB)
  keycloak:
    image: keycloak/keycloak:24.0.4
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-420m}
    container_name: haloticket-keycloak
    restart: unless-stopped
    logging: *logging
    command: ${KEYCLOAK_COMMAND:-start-dev} --import-realm
    ports:
      - "${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-9080}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-haloticket}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080}
      KC_HOSTNAME_STRICT: ${KEYCLOAK_HOSTNAME_STRICT:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?GOOGLE_OAUTH_CLIENT_ID must be set}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?GOOGLE_OAUTH_CLIENT_SECRET must be set}
      KC_DB_POOL_INITIAL_SIZE: 1
      KC_DB_POOL_MIN_SIZE: 1
      KC_DB_POOL_MAX_SIZE: 8
      JAVA_OPTS_APPEND: "-Xms64m -Xmx320m -XX:MaxMetaspaceSize=128m"
    volumes:
      - ./haloticket-infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ./haloticket-infrastructure/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - haloticket-network

  # Application Microservices

  discovery-server:
    <<: *runtime
    mem_limit: ${DISCOVERY_MEMORY_LIMIT:-200m}
    container_name: haloticket-discovery-server
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-discovery-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: discovery-server
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${DISCOVERY_SERVER_PORT:-8761}:8761"]
    environment:
      <<: *environment
      SERVER_PORT: "8761"
      EUREKA_INSTANCE_HOSTNAME: discovery-server

  api-gateway:
    <<: *runtime
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-200m}
    container_name: haloticket-api-gateway
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    ports: ["${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${API_GATEWAY_PORT:-8888}:8888"]
    environment:
      <<: *environment
      SERVER_PORT: "8888"
      GATEWAY_DISCOVERY_LOCATOR_ENABLED: ${GATEWAY_DISCOVERY_LOCATOR_ENABLED:-false}
      GATEWAY_AUTHZ_ENABLED: ${GATEWAY_AUTHZ_ENABLED:-true}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080}/realms/${KEYCLOAK_REALM:-haloticket-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-haloticket-realm}/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:5174,https://haloticket-web.pages.dev}
    depends_on:
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  user-service:
    <<: *runtime
    mem_limit: ${USER_MEMORY_LIMIT:-300m}
    container_name: haloticket-user-service
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-user-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${USER_SERVICE_PORT:-8081}:8081"]
    environment:
      <<: *environment
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080}/realms/${KEYCLOAK_REALM:-haloticket-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-haloticket-realm}/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-haloticket-realm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-user-service}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-user-service-secret}
      AUTH_OTP_PEPPER: ${AUTH_OTP_PEPPER:-haloticket-default-secret-pepper-2026}
      VNPT_EKYC_ENABLED: ${VNPT_EKYC_ENABLED:-false}
      VNPT_EKYC_BASE_URL: ${VNPT_EKYC_BASE_URL:-https://api.idg.vnpt.vn}
      VNPT_EKYC_TOKEN_ID: ${VNPT_EKYC_TOKEN_ID:-}
      VNPT_EKYC_TOKEN_KEY: ${VNPT_EKYC_TOKEN_KEY:-}
      VNPT_EKYC_ACCESS_TOKEN: ${VNPT_EKYC_ACCESS_TOKEN:-}
      EKYC_FINGERPRINT_SECRET: ${EKYC_FINGERPRINT_SECRET:-haloticket-ekyc-fingerprint-secret-2026}
    depends_on:
      <<: *dependencies
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy

  event-service:
    <<: *runtime
    mem_limit: ${EVENT_MEMORY_LIMIT:-300m}
    container_name: haloticket-event-service
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-event-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: event-service
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${EVENT_SERVICE_PORT:-8082}:8082"]
    environment:
      <<: *environment
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_db
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080}/realms/${KEYCLOAK_REALM:-haloticket-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-haloticket-realm}/protocol/openid-connect/certs
    depends_on:
      <<: *dependencies

  ticket-service:
    <<: *runtime
    mem_limit: ${TICKET_MEMORY_LIMIT:-450m}
    container_name: haloticket-ticket-service
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-ticket-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ticket-service
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${TICKET_SERVICE_PORT:-8083}:8083"]
    environment:
      <<: *environment
      SERVER_PORT: "8083"
      TICKET_RESERVATION_INTERNAL_TOKEN: ${TICKET_RESERVATION_INTERNAL_TOKEN:-}
      # Check-in window: defaults match ticket-service/application.yaml (off).
      CHECKIN_WINDOW_ENABLED: ${CHECKIN_WINDOW_ENABLED:-false}
      CHECKIN_WINDOW_OPEN_BEFORE_MINUTES: ${CHECKIN_WINDOW_OPEN_BEFORE_MINUTES:-180}
      CHECKIN_WINDOW_CLOSE_AFTER_END_MINUTES: ${CHECKIN_WINDOW_CLOSE_AFTER_END_MINUTES:-120}
      CHECKIN_WINDOW_FAIL_OPEN: ${CHECKIN_WINDOW_FAIL_OPEN:-true}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket_db
      TRANSFER_INTERNAL_TOKEN: ${TRANSFER_INTERNAL_TOKEN:-}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080}/realms/${KEYCLOAK_REALM:-haloticket-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-haloticket-realm}/protocol/openid-connect/certs
    depends_on:
      <<: *dependencies

  marketplace-service:
    <<: *runtime
    mem_limit: ${MARKETPLACE_MEMORY_LIMIT:-300m}
    container_name: haloticket-marketplace-service
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-marketplace-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: marketplace-service
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${MARKETPLACE_SERVICE_PORT:-8088}:8088"]
    environment:
      <<: *environment
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marketplace_db
      TRANSFER_INTERNAL_TOKEN: ${TRANSFER_INTERNAL_TOKEN:-}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080}/realms/${KEYCLOAK_REALM:-haloticket-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-haloticket-realm}/protocol/openid-connect/certs
    depends_on:
      <<: *dependencies
      kafka:
        condition: service_healthy

  booking-service:
    <<: *runtime
    mem_limit: ${BOOKING_MEMORY_LIMIT:-300m}
    container_name: haloticket-booking-service
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-booking-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: booking-service
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${BOOKING_SERVICE_PORT:-8084}:8084"]
    environment:
      <<: *environment
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      BOOKING_GA_RESERVATION_ENABLED: ${BOOKING_GA_RESERVATION_ENABLED:-false}
      TICKET_RESERVATION_INTERNAL_TOKEN: ${TICKET_RESERVATION_INTERNAL_TOKEN:-}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080}/realms/${KEYCLOAK_REALM:-haloticket-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-haloticket-realm}/protocol/openid-connect/certs
    depends_on:
      <<: *dependencies
      redis:
        condition: service_healthy

  payment-service:
    <<: *runtime
    mem_limit: ${PAYMENT_MEMORY_LIMIT:-300m}
    container_name: haloticket-payment-service
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-payment-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-service
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${PAYMENT_SERVICE_PORT:-8085}:8085"]
    environment:
      <<: *environment
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:9080}/realms/${KEYCLOAK_REALM:-haloticket-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-haloticket-realm}/protocol/openid-connect/certs
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-2QXUYB07}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-AXYZ12345678909876543210ABCDEFGH}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:5173/payment/callback}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:5173/payment/callback}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost:8888/api/payments/momo/ipn}
      ZALOPAY_ENDPOINT: ${ZALOPAY_ENDPOINT:-https://sb-openapi.zalopay.vn/v2/create}
      ZALOPAY_REDIRECT_URL: ${ZALOPAY_REDIRECT_URL:-http://localhost:5173/payment/callback}
      ZALOPAY_IPN_URL: ${ZALOPAY_IPN_URL:-http://localhost:8888/api/payments/zalopay/ipn}
      SHOPEEPAY_REDIRECT_URL: ${SHOPEEPAY_REDIRECT_URL:-http://localhost:5173/payment/callback}
      SHOPEEPAY_IPN_URL: ${SHOPEEPAY_IPN_URL:-http://localhost:8888/api/payments/shopeepay/ipn}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      SEPAY_USER_TOKEN: ${SEPAY_USER_TOKEN:-}
      SEPAY_ACCOUNT_NO: ${SEPAY_ACCOUNT_NO:-0915020803}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-MBBank}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-}
      ZALOPAY_KEY1: ${ZALOPAY_KEY1:-}
      ZALOPAY_KEY2: ${ZALOPAY_KEY2:-}
      SHOPEEPAY_PARTNER_ID: ${SHOPEEPAY_PARTNER_ID:-}
      SHOPEEPAY_SECRET_KEY: ${SHOPEEPAY_SECRET_KEY:-}
      PAYMENT_SANDBOX_RETURN_CONFIRMATION_ENABLED: ${PAYMENT_SANDBOX_RETURN_CONFIRMATION_ENABLED:-false}
    depends_on:
      <<: *dependencies

  notification-service:
    <<: *runtime
    mem_limit: ${NOTIFICATION_MEMORY_LIMIT:-300m}
    container_name: haloticket-notification-service
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-notification-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-service
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${NOTIFICATION_SERVICE_PORT:-8086}:8086"]
    environment:
      <<: *environment
      SERVER_PORT: "8086"
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@haloticket.local}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      NOTIFICATION_GIFT_ACCEPT_BASE_URL: ${GIFT_ACCEPT_BASE_URL:-http://localhost:5173/gifts/accept}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
    depends_on:
      <<: *dependencies
      kafka:
        condition: service_healthy

  media-service:
    <<: *runtime
    mem_limit: ${MEDIA_MEMORY_LIMIT:-200m}
    container_name: haloticket-media-service
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-media-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: media-service
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${MEDIA_SERVICE_PORT:-8087}:8087"]
    environment:
      <<: *environment
      SERVER_PORT: "8087"
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-haloticket-media-bucket}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy-access-key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
    depends_on:
      discovery-server:
        condition: service_healthy

  ai-assistant-service:
    image: ${DOCKERHUB_USERNAME:-haloticket}/haloticket-ai-assistant-service:${IMAGE_TAG:-latest}
    build:
      context: ./ai-assistant-service
      dockerfile: Dockerfile
    container_name: haloticket-ai-assistant
    restart: unless-stopped
    ports: ["${SERVICE_BIND_ADDRESS:-127.0.0.1}:${AI_ASSISTANT_PORT:-8089}:8089"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://haloticket:secretpassword@postgres:5432/event_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EUREKA_SERVER=http://discovery-server:8761/eureka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ALERT_SSL_DOMAINS=${ALERT_SSL_DOMAINS:-haloticket-web.pages.dev,haloticket.duckdns.org}
    volumes:
      - ./ai-assistant-service/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - haloticket-network
volumes:
  postgres_data:
    name: haloticket-postgres-data
  redis_data:
