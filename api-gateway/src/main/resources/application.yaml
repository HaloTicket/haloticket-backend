server:
  port: 8888

spring:
  application:
    name: api-gateway

  # config Keycloak (token issuer)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/haloticket-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

  cloud:
    gateway:
      discovery:
        locator:
          # off: only the explicit routes below are reachable. On exposes every Eureka service as /<service-id>/**
          enabled: ${GATEWAY_DISCOVERY_LOCATOR_ENABLED:false}
          lower-case-service-id: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # routing rules
      routes:
        - id: auth-user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/api/events/**

        - id: ticket-service
          uri: lb://TICKET-SERVICE
          predicates:
            - Path=/api/tickets/**

        - id: marketplace-service
          uri: lb://MARKETPLACE-SERVICE
          predicates:
            - Path=/api/marketplace/**, /api/gifts/**

        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**

        - id: booking-service-seats
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/seats/**

        - id: booking-service-websocket
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/ws/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**, /api/payouts/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**, /ws-notifications/**

        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/api/media/**

        - id: ai-assistant-service
          uri: lb://AI-ASSISTANT-SERVICE
          predicates:
            - Path=/api/customer/**, /api/organizer/**, /api/admin/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# DEBUG for these two prints request headers (Authorization) and query strings; turn it on only while debugging
logging:
  level:
    org.springframework.security: ${GATEWAY_LOG_LEVEL_SECURITY:INFO}
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL_ROUTING:INFO}

gateway:
  authz:
    enabled: ${GATEWAY_AUTHZ_ENABLED:true}
    # data-analysis and voucher-strategy of the AI service need ROLE_ADMIN; false lets organizers in (the service then limits
    # them to their own events). agent-chat needs ROLE_ADMIN whatever this says. Only while authz is enabled.
    ai-analysis-admin-only:
      enabled: ${GATEWAY_AUTHZ_AI_ANALYSIS_ADMIN_ONLY:true}
