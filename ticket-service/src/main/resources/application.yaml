server:
  port: 8083

spring:
  application:
    name: ticket-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ticket_db}
    username: ${POSTGRES_USER:haloticket}
    password: ${POSTGRES_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/haloticket-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: TRACE

checkin:
  window:
    enabled: ${CHECKIN_WINDOW_ENABLED:false}
    open-before-minutes: ${CHECKIN_WINDOW_OPEN_BEFORE_MINUTES:180}
    close-after-end-minutes: ${CHECKIN_WINDOW_CLOSE_AFTER_END_MINUTES:120}
    fail-open: ${CHECKIN_WINDOW_FAIL_OPEN:true}

ticket:
  stock-reservation:
    # shared secret for booking-service -> ticket-service stock holds; blank rejects every call
    internal-token: ${TICKET_RESERVATION_INTERNAL_TOKEN:}
    expiry-interval-ms: ${TICKET_RESERVATION_EXPIRY_INTERVAL_MS:30000}
