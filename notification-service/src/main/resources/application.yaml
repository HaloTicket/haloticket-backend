server:
  port: 8086

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9080/realms/haloticket-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_GROUP:notification-auth-otp}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:10000}
      mail.smtp.timeout: ${SMTP_TIMEOUT:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT:10000}
  mongodb:
    uri: ${NOTIFICATION_MONGODB_URI:mongodb://localhost:27017/haloticket_notifications?directConnection=true}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

management:
  endpoint:
    health:
      group:
        notification-storage:
          include: mongo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

notification:
  content-scan-url: ${NOTIFICATION_CONTENT_SCAN_URL:http://localhost:8089/internal/notification-content-scan}
  frontend-base-url: ${PUBLIC_FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${SMTP_FROM:no-reply@haloticket.local}
  kafka:
    auth-otp-topic: ${AUTH_OTP_KAFKA_TOPIC:haloticket.auth.otp.v1}
    auth-otp-group: ${AUTH_OTP_KAFKA_GROUP:notification-auth-otp}
    topic: ${NOTIFICATION_KAFKA_TOPIC:haloticket.notifications.v1}
    group: ${NOTIFICATION_KAFKA_GROUP:notification-service}
